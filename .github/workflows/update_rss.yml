name: update_rss

on:
  # schedule:
  #   - cron: '0 14 * * *' # This runs the workflow every day at 3 AM NZT (2 PM UTC the previous day)
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # - name: Set up PowerShell
      #   uses: actions/setup-pwsh@v2

      - name: Run PowerShell script
        run: pwsh ./src/run.ps1
        env:
          OPENDRIVE_USERNAME: ${{ secrest.OPENDRIVE_USERNAME }}
          OPENDRIVE_PASSWORD: ${{ secrest.OPENDRIVE_PASSWORD }}