name: update_rss

on:
  # Inherited from the retired static.yml, so pushing to main still deploys
  push:
    branches: ["main"]

  workflow_dispatch:

# Least privilege. contents:read is for checkout; pages:write plus id-token:write
# are required together because deploy-pages exchanges an OIDC token for the
# Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages accepts only one deployment at a time. Queue rather than cancel, so a
# newer feed can never be replaced by an older run finishing late.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Secrets
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            b299e4a7-305c-49d3-b4a7-b4710057e3de > OPENDRIVE_PASSWORD
            40d1fdb2-bec1-4325-98dd-b4710057d5c2 > OPENDRIVE_USERNAME
            2fdac243-dc08-4261-b72e-b4e6001f1523 > CLOUDFLARE_BIBLE_POD_ACCESS_KEY_ID
            1889ca55-e8a1-4f30-b737-b4e6001f4477 > CLOUDFLARE_BIBLE_POD_SECRET_ACCESS_KEY
            b6a969d6-37ce-4110-bad0-b4e6001ee9df > CLOUDFLARE_R2_URL

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run PowerShell script - opendrive
        run: |
          pwsh ./src/run.ps1
          cp *.xml ./public
        env:
          TZ: Pacific/Auckland

      # Runs after the OpenDrive copy above, which is what keeps the two sets
      # apart: this script writes the same .xml filenames to the repo root, so
      # the OpenDrive set has to be copied out of the way first. These feeds
      # land in ./public/rss, served at /bible_pod/rss, which is the self-link
      # run-cloudflare.ps1 emits.
      - name: Run PowerShell script - Cloudflare
        run: |
          mkdir -p ./public/rss
          pwsh ./src/run-cloudflare.ps1
          cp *.xml ./public/rss/
        env:
          TZ: Pacific/Auckland

      # Guards against publishing a partial feed set. upload-pages-artifact
      # takes a whole directory rather than listing files, so a feed that
      # failed to generate would otherwise be deployed without it and any
      # subscriber to that feed would 404 on the next run. Both sets are checked
      # where they are served from rather than in the repo root, since by now
      # the root holds only the Cloudflare output: each script overwrites the
      # previous one's files.
      - name: Verify all six feeds were generated
        run: |
          missing=0
          for dir in ./public ./public/rss; do
            for f in tniv_OT tniv_NT tniv_Psalms tniv_Proverbs tniv_WNT tniv_WOT; do
              if [ ! -s "$dir/$f.xml" ]; then
                echo "MISSING or empty: $dir/$f.xml" >&2
                missing=1
              fi
            done
            ls -l "$dir"/tniv_*.xml
          done
          [ "$missing" -eq 0 ] || exit 1

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Publishes the whole of ./public, so the static site and the six
      # generated feeds ship from a single deployment. bibleListenPlan.csv is
      # excluded by the explicit `cp *.xml` above rather than by this path,
      # since the CSV lands in the repo root and never enters ./public. Note
      # that .gitignore does not apply to artifact uploads, so that cp is the
      # only thing keeping the plan out of the published site.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: './public'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
