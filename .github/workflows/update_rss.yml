name: update_rss

on:
  schedule:
    - cron: '0 14 * * *' # This runs the workflow every day at 3 AM NZT (2 PM UTC the previous day)
  workflow_dispatch:

# Least privilege. contents:read is for checkout; pages:write plus id-token:write
# are required together because deploy-pages exchanges an OIDC token for the
# Pages deployment token.
permissions:
  contents: read
  pages: write
  id-token: write

# Pages accepts only one deployment at a time. Queue rather than cancel, so a
# newer feed can never be replaced by an older run finishing late.
concurrency:
  group: github-pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Secrets
        uses: bitwarden/sm-action@27c0c9dcab679d7250dbab91227c85b49ffa5e0f # v3.0.0
        with:
          access_token: ${{ secrets.BWS_ACCESS_TOKEN }}
          secrets: |
            b299e4a7-305c-49d3-b4a7-b4710057e3de > OPENDRIVE_PASSWORD
            40d1fdb2-bec1-4325-98dd-b4710057d5c2 > OPENDRIVE_USERNAME

      - name: Checkout repository
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6

      - name: Run PowerShell script
        run: |
          pwsh ./src/run.ps1
        env:
          TZ: Pacific/Auckland

      - name: Configure Pages
        uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0

      # Globbed rather than listing the four feeds by name so a new category in
      # the plan is published without a workflow edit. Scoped to *.xml so the
      # bibleListenPlan.csv that run.ps1 also drops in the repo root stays
      # unpublished; the .gitignore that hides those files does not apply to
      # artifact uploads.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: '*.xml'

  deploy:
    needs: build
    runs-on: ubuntu-latest

    # Required by GitHub to gate the deployment and to surface the page URL in
    # the run summary
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
